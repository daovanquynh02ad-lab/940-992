let state = {
  tab: 'leaks', // 'leaks' | 't57' | 't89' | 'drill'
  masked: true,
  learnedIds: [],
  drillQueue: [],
  drillRevealed: false,
  timerSec: 60,
  timerOn: false
};
let tInt = null;

function toggleMaskAll() {
  state.masked = !state.masked;
  render();
}

function togglePill(el, ev) {
  ev.stopPropagation();
  if (el.classList.contains('masked')) {
    el.classList.remove('masked');
    el.innerText = el.dataset.ans;
  } else {
    el.classList.add('masked');
    el.innerText = '🔒 ' + el.dataset.hint;
  }
}

function formatText(str, forceOpen = false) {
  return str.replace(/\{\{([^}|]+)\|([^}]+)\}\}/g, (_, ans, hint) => {
    const m = state.masked && !forceOpen;
    return `<span class="pill ${m ? 'masked' : ''}" data-ans="${ans}" data-hint="${hint}" onclick="togglePill(this, event)">${m ? '🔒 ' + hint : ans}</span>`;
  });
}

function setTab(t) {
  clearInterval(tInt);
  state.timerOn = false;
  state.tab = t;
  if (t === 'drill') initDrill();
  render();
  document.getElementById('cnt').scrollTop = 0;
}

function initDrill() {
  const unlearned = CARDS.filter(c => !state.learnedIds.includes(c.id));
  state.drillQueue = (unlearned.length ? unlearned : [...CARDS]).sort(() => Math.random() - 0.5);
  state.drillRevealed = false;
  startDrillTimer();
}

function startDrillTimer() {
  clearInterval(tInt);
  state.timerSec = 60;
  state.timerOn = true;
  tInt = setInterval(() => {
    state.timerSec--;
    const el = document.getElementById('d-timer');
    if (el) el.innerText = state.timerSec + ' сек';
    if (state.timerSec <= 0) {
      clearInterval(tInt);
      state.drillRevealed = true;
      render();
    }
  }, 1000);
}

function markDrill(known) {
  const cur = state.drillQueue[0];
  if (!cur) return;
  state.drillQueue.shift();
  if (known) {
    if (!state.learnedIds.includes(cur.id)) state.learnedIds.push(cur.id);
  } else {
    // Возвращаем карточку через 2 позиции, чтобы добить до автомата
    const insertIdx = Math.min(2, state.drillQueue.length);
    state.drillQueue.splice(insertIdx, 0, cur);
  }
  state.drillRevealed = false;
  if (state.drillQueue.length > 0) startDrillTimer();
  else clearInterval(tInt);
  render();
}

function render() {
  const hdr = document.getElementById('hdr');
  const cnt = document.getElementById('cnt');
  const ftr = document.getElementById('ftr');

  hdr.innerHTML = `
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-xl bg-gold text-black font-black flex items-center justify-center text-base">I</div>
      <div>
        <div class="font-black text-sm leading-none">Imed • Патан Блиц</div>
        <div class="text-[10px] text-slate-400 font-bold mt-0.5">Выучено до автомата: ${state.learnedIds.length} / ${CARDS.length}</div>
      </div>
    </div>
    ${state.tab !== 'drill' ? `
      <button onclick="toggleMaskAll()" class="btn px-3 py-1.5 rounded-xl font-bold text-xs ${state.masked ? 'bg-gold text-black' : 'bg-slate-800 text-slate-200'}">
        ${state.masked ? '👁 Открыть всё' : '🔒 Скрыть термины'}
      </button>
    ` : `
      <button onclick="state.learnedIds=[];initDrill();render()" class="btn px-3 py-1.5 rounded-xl font-bold text-xs bg-slate-800 text-rose-400">Сброс</button>
    `}
  `;

  if (state.tab === 'drill') {
    const cur = state.drillQueue[0];
    if (!cur) {
      cnt.innerHTML = `
        <div class="text-center py-16">
          <div class="text-5xl mb-4">🏆</div>
          <h2 class="text-2xl font-black mb-2">Все ${CARDS.length} вопросов добиты!</h2>
          <p class="text-slate-400 text-sm mb-6">Ты ответил без ошибок на всю базу сливов и тем 5–9.</p>
          <button onclick="state.learnedIds=[];initDrill();render()" class="btn bg-gold text-black font-black px-6 py-4 rounded-2xl">Пройти круг заново</button>
        </div>`;
    } else {
      cnt.innerHTML = `
        <div class="flex justify-between items-center mb-3">
          <span class="text-xs font-bold text-slate-400">Осталось добить: ${state.drillQueue.length}</span>
          <span id="d-timer" class="text-sm font-black px-3 py-1 rounded-lg bg-slate-800 text-gold">${state.timerSec} сек</span>
        </div>
        <div class="card-box">
          <div class="text-[11px] font-bold text-gold uppercase tracking-wider mb-1">${cur.tag}</div>
          <div class="text-lg font-black text-white mb-3">${cur.q}</div>
          <div class="text-xs text-slate-400 mb-4 bg-slate-900/90 p-3 rounded-xl border border-slate-800">
            ✍️ <b>Задание:</b> проговори вслух или набросай на листке <b>${cur.pts.length} ключевых пункта</b> ответа и нажми «Показать ответ».
          </div>
          ${!state.drillRevealed ? `
            <button onclick="clearInterval(tInt);state.drillRevealed=true;render()" class="btn w-full py-4 rounded-2xl bg-gold text-black font-black text-sm">👁 Показать эталон ответа</button>
          ` : `
            <div class="mt-2 pt-2 border-t border-slate-800">
              ${cur.pts.map((p, i) => `
                <div class="pt-row">
                  <span class="num-badge">0${i+1}</span>
                  <div class="text-sm leading-relaxed text-slate-200">${formatText(p, true)}</div>
                </div>
              `).join('')}
            </div>
            <div class="grid grid-cols-2 gap-3 mt-4">
              <button onclick="markDrill(false)" class="btn py-3.5 rounded-xl bg-rose-500/20 border border-rose-500/40 text-rose-300 font-black text-xs">🔄 Плаваю (Повторить)</button>
              <button onclick="markDrill(true)" class="btn py-3.5 rounded-xl bg-emerald-500 text-black font-black text-xs">✅ Знаю чётко!</button>
            </div>
          `}
        </div>
      `;
    }
  } else {
    const list = CARDS.filter(c => c.cat === state.tab);
    cnt.innerHTML = list.map(c => `
      <div class="card-box">
        <div class="flex justify-between items-center mb-1">
          <span class="text-[10px] font-extrabold text-gold uppercase tracking-wider">${c.tag}</span>
          ${state.learnedIds.includes(c.id) ? '<span class="text-[10px] font-bold text-emerald-400">✓ Выучено</span>' : ''}
        </div>
        <div class="text-base font-black text-white mb-2 pb-2 border-b border-slate-800">${c.q}</div>
        <div>
          ${c.pts.map((p, i) => `
            <div class="pt-row">
              <span class="num-badge">0${i+1}</span>
              <div class="text-[13.5px] leading-relaxed text-slate-200">${formatText(p)}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('');
  }

  ftr.innerHTML = `
    <div class="grid grid-cols-4 gap-1.5">
      <button onclick="setTab('leaks')" class="btn py-2.5 rounded-xl font-extrabold text-[11px] ${state.tab==='leaks'?'bg-gold text-black':'bg-slate-900 text-slate-400'}">🔥 Сливы (7)</button>
      <button onclick="setTab('t57')" class="btn py-2.5 rounded-xl font-extrabold text-[11px] ${state.tab==='t57'?'bg-gold text-black':'bg-slate-900 text-slate-400'}">📚 Темы 5–7</button>
      <button onclick="setTab('t89')" class="btn py-2.5 rounded-xl font-extrabold text-[11px] ${state.tab==='t89'?'bg-gold text-black':'bg-slate-900 text-slate-400'}">🦠 Воспал.</button>
      <button onclick="setTab('drill')" class="btn py-2.5 rounded-xl font-extrabold text-[11px] ${state.tab==='drill'?'bg-emerald-400 text-black':'bg-slate-900 text-emerald-400 border border-emerald-500/30'}">⚡ Тренажёр</button>
    </div>
  `;
}

render();
</script>
